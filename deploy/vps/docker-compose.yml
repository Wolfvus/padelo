services:
  padelo:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: padelo:local
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      WEB_DIR: /app/web
    expose:
      - "8080"
    networks:
      - caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
